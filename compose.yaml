services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: audit
      POSTGRES_DB: audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - audit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      DATABASE_URL: postgres://audit:${POSTGRES_PASSWORD}@db:5432/audit?sslmode=disable
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set initial ADMIN_PASSWORD in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8090}
      LISTEN_ADDR: 0.0.0.0:8090
      AUDIT_SUB2API_ORIGINS: ${AUDIT_SUB2API_ORIGINS:-}
      AUDIT_MODEL_CONCURRENCY: ${AUDIT_MODEL_CONCURRENCY:-16}
      AUDIT_REQUEST_CONCURRENCY: ${AUDIT_REQUEST_CONCURRENCY:-32}
      AUDIT_REQUEST_BODY_MIB: ${AUDIT_REQUEST_BODY_MIB:-128}
      AUDIT_TRIAL_CONCURRENCY: ${AUDIT_TRIAL_CONCURRENCY:-2}
      AUDIT_MAX_IMAGES: ${AUDIT_MAX_IMAGES:-16}
      AUDIT_INGRESS_RPM: ${AUDIT_INGRESS_RPM:-6000}
      AUDIT_INGRESS_IP_RPM: ${AUDIT_INGRESS_IP_RPM:-600}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  audit-postgres:
